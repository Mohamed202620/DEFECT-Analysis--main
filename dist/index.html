    <style>html,body{color:#fff;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background-color:#111!important}#root{background-color:#111;width:100%;height:100%}#game-loader{z-index:99999;color:#fff;text-align:center;background-color:#111;flex-direction:column;justify-content:center;align-items:center;padding:24px;font-family:Cairo,system-ui,-apple-system,sans-serif;transition:opacity .35s,visibility .35s;display:flex;position:fixed;inset:0}.preloader-spinner{border:4px solid #27272a;border-top-color:#fc0;border-radius:50%;width:48px;height:48px;animation:.85s linear infinite spin}@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}</style>
    <script type="module" crossorigin src="./assets/index-DUHE3dnF.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CEgujKA3.css">
  </head>
  <body style="background-color: #111111; color: #ffffff; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;" class="bg-neutral-950 text-white select-none overflow-hidden touch-none">
    <!-- Game Loader Overlay: Automatically fades out and hides after 2 seconds even if assets fail -->
    <div id="game-loader">
      <div style="width: 80px; height: 80px; margin-bottom: 18px; background: linear-gradient(135deg, #ffcc00, #d97706); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 10px 30px rgba(255, 204, 0, 0.3);">
        🥫
      </div>
      <div style="font-size: 26px; font-weight: 900; color: #ffcc00; margin-bottom: 4px; letter-spacing: -0.5px;">
        CAN CRUSH PRO
      </div>
      <div style="font-size: 15px; font-weight: 700; color: #e4e4e7; margin-bottom: 20px;">
        كسارة الكانز
      </div>
      <div class="preloader-spinner" style="margin-bottom: 16px;"></div>
      <div id="loader-status" style="font-size: 13px; color: #a1a1aa; font-weight: 600;">
        جارِ تشغيل اللعبة...
      </div>
      <button id="loader-retry" onclick="location.reload()" style="display: none; margin-top: 14px; padding: 8px 18px; background-color: #ffcc00; color: #000; border: none; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer;">
        إعادة التحميل الآن 🔄
      </button>
    </div>

    <!-- Main Game Root Container -->
    <div id="root"></div>

    <script>
      // 1. Check if React mounted before dismissing loader to prevent black screen
      setTimeout(function() {
        var root = document.getElementById('root');
        var loader = document.getElementById('game-loader');
        var status = document.getElementById('loader-status');
        var retry = document.getElementById('loader-retry');

        if (root && root.children.length > 0) {
          if (loader) {
            loader.style.opacity = '0';
            loader.style.pointerEvents = 'none';
            setTimeout(function() {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 350);
          }
        } else {
          // If React is taking longer, show reload button instead of leaving a black screen
          if (status) status.innerText = 'استغرق التحميل وقتاً إضافياً. اضغط لإعادة التشغيل:';
          if (retry) retry.style.display = 'inline-block';
        }
      }, 2500);

    </script>
  </body>
</html>
