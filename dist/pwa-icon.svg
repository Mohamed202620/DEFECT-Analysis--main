<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#1e293b"/>
      <stop offset="100%" stopColor="#09090b"/>
    </radialGradient>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#713f12"/>
      <stop offset="25%" stopColor="#eab308"/>
      <stop offset="45%" stopColor="#ffffff"/>
      <stop offset="65%" stopColor="#eab308"/>
      <stop offset="100%" stopColor="#713f12"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#64748b"/>
      <stop offset="40%" stopColor="#ffffff"/>
      <stop offset="100%" stopColor="#334155"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#facc15" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Can Group Centered -->
  <g transform="translate(256, 256) scale(1.65) translate(-50, -80)" filter="url(#glow)">
    <!-- Tapered Rim Choke -->
    <path d="M 22,25 C 22,20 25,17 28,15 L 72,15 C 75,17 78,20 78,25 L 78,28 L 22,28 Z" fill="url(#metalRim)"/>
    
    <!-- Can Body -->
    <path d="M 20,26 L 80,26 L 80,138 C 80,144 74,148 50,148 C 26,148 20,144 20,138 Z" fill="url(#canBody)" stroke="#09090b" stroke-width="1.5"/>

    <!-- Bottom Rim -->
    <path d="M 24,138 C 26,144 74,144 76,138 L 75,142 C 73,146 27,146 25,142 Z" fill="url(#metalRim)"/>

    <!-- Specular Highlight -->
    <rect x="42" y="26" width="5" height="112" fill="#ffffff" fill-opacity="0.65"/>

    <!-- Stay-on Tab & Chime -->
    <ellipse cx="50" cy="15" rx="25" ry="6" fill="url(#metalRim)" stroke="#334155" stroke-width="1"/>
    <ellipse cx="50" cy="15" rx="22" ry="4.8" fill="#cbd5e1"/>
    
    <!-- Die-cast Pull tab -->
    <ellipse cx="54" cy="15" rx="7" ry="2" fill="#64748b"/>
    <circle cx="46" cy="15" r="1.5" fill="#ffffff"/>

    <!-- Brand Emblem -->
    <text x="50" y="80" fill="#000000" font-size="14" font-weight="900" font-family="'Cairo', sans-serif" text-anchor="middle" letter-spacing="1">PRO</text>
    <text x="50" y="96" fill="#78350f" font-size="9" font-weight="900" font-family="'Cairo', sans-serif" text-anchor="middle">⚡ CRUSH</text>

    <!-- Explosion Sparks -->
    <path d="M 12,50 L 2,45 L 10,58 Z" fill="#facc15"/>
    <path d="M 88,60 L 98,54 L 90,68 Z" fill="#facc15"/>
  </g>
</svg>
