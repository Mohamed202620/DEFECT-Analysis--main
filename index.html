<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAINTENANCE & DEFECT SYSTEM V1.0</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0E1117">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-main: #0E1117;
      --card-bg: #1E293B;
      --border-color: #334155;
      --text-color: #ffffff;
    }
    body { background-color: var(--bg-main); color: var(--text-color); margin: 0; font-family: system-ui, sans-serif; }
    .btn-action {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 12px; text-align: center; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px; width: 100%;
    }
    .btn-action:active { transform: scale(0.96); }
    .app-header { 
      background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 12px 16px; 
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash" class="fixed inset-0 bg-[#0E1117] flex flex-col items-center justify-center z-50 transition-opacity duration-700">
    <img src="1000230635.png" alt="Logo" class="w-24 h-24 object-contain mb-4 animate-pulse"/>
    <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div id="app"></div>

  <!-- ربط الـ Router الأساسي عبر type="module" -->
  <script type="module">
    import { router } from './js/router.js';

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.style.display = 'none', 700);
        }
        router.navigateTo('home');
      }, 1000);
    });
  </script>

</body>
</html>
