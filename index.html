<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAINTENANCE & DEFECT SYSTEM V1.0</title>

  <!-- قم بإلغاء تعليق السطر التالي فقط عند النشر النهائي على GitHub Pages -->
  <!-- <base href="/DEFECT-Analysis--main/" /> -->

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E1117">

  <!-- Chart.js & Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- سكريبت مبكر لمنع التذبذب في الألوان أثناء التحميل -->
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // دالة عامة لإخفاء شاشة التحميل
    window.hideSplash = function () {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 700);
      }
    };
  </script>

  <style>
    :root {
      --app-main-bg: #f3f4f6; 
      --app-header-bg: rgba(255, 255, 255, 0.95);
      --app-card-bg: #ffffff;
      --app-card-inner: #f9fafb;
      --app-btn-bg: #ffffff;
      --app-btn-hover: #f3f4f6;
      --app-border: #e5e7eb;
      --app-text: #1f2937;
      --app-text-muted: #6b7280;
      --app-support-bg: #eff6ff;
      --app-support-border: #bfdbfe;
      --app-support-text: #1d4ed8;
      --app-icon-bg: #f3f4f6;
    }
    
    .dark, body.dark, html.dark, [data-theme="dark"] {
      --app-main-bg: #0f172a; 
      --app-header-bg: rgba(14, 17, 23, 0.9);
      --app-card-bg: rgba(30, 41, 59, 0.4);
      --app-card-inner: rgba(0, 0, 0, 0.2);
      --app-btn-bg: rgba(30, 41, 59, 0.6);
      --app-btn-hover: rgba(255, 255, 255, 0.1);
      --app-border: rgba(255, 255, 255, 0.08);
      --app-text: #f3f4f6;
      --app-text-muted: #9ca3af;
      --app-support-bg: rgba(37, 99, 235, 0.15);
      --app-support-border: rgba(37, 99, 235, 0.3);
      --app-support-text: #93c5fd;
      --app-icon-bg: rgba(255, 255, 255, 0.05);
    }

    * { 
      box-sizing: border-box; 
      font-family: system-ui, -apple-system, sans-serif; 
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; 
    }

    body, html, #app { 
      background-color: var(--app-main-bg) !important; 
      color: var(--app-text) !important; 
      margin: 0; 
      padding: 0; 
      min-height: 100vh; 
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash" class="fixed inset-0 w-full h-full bg-[#0E1117] flex flex-col items-center justify-center z-50 transition-opacity duration-700">
    <div class="flex-1 flex items-center justify-center p-4 w-full max-w-sm">
      <img src="1000230635.png" alt="Splash Icon" class="w-full max-h-[70vh] object-contain rounded-3xl shadow-2xl animate-pulse" onerror="this.style.display='none'"/>
    </div>

    <div class="pb-10 flex flex-col items-center gap-5">
      <div class="px-5 py-1.5 bg-[#1E293B] rounded-full text-xs text-blue-400 border border-gray-700/60 font-semibold shadow-inner">
        v1.0 - 2026
      </div>
      <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- App Main Container -->
  <div id="app"></div>

  <!-- App Scripts -->
  <script>
    window.addEventListener("error", function (e) {
        console.error("Application Error:", e.error || e.message);
        window.hideSplash();
    });

    window.addEventListener("unhandledrejection", function (e) {
        console.error("Promise Error:", e.reason);
        window.hideSplash();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => console.log('SW Registered:', registration.scope))
          .catch(err => console.error('SW Error:', err));
      });
    }

    setTimeout(() => {
      window.hideSplash();
    }, 3000);
  </script>

  <!-- فحص تسلسلي لمعرفة الملف المسبب لـ SyntaxError -->
  <script type="module">
    const modulesToTest = [
      "./js/config.js",
      "./js/auth/login.js",
      "./js/services/api.js",
      "./js/components/PageView.js",
      "./js/views/loginView.js",
      "./js/views/registerView.js",
      "./js/views/homeView.js",
      "./js/views/pmView.js",
      "./js/views/reportView.js",
      "./js/views/reportsView.js",
      "./js/views/suggestionView.js",
      "./js/views/issueView.js",
      "./js/views/MaintenanceView.js",
      "./js/views/QualityView.js",
      "./js/views/SystemView.js",
      "./js/workflow.js",
      "./js/router.js"
    ];

    async function diagnoseApp() {
      console.log("بدء الفحص التشخيصي للملفات...");
      
      for (const filePath of modulesToTest) {
        try {
          await import(filePath);
          console.log(`✅ تم تحميل: ${filePath}`);
        } catch (err) {
          console.error(`❌ خطأ في الملف: ${filePath}`, err);
          window.hideSplash();

          const appDiv = document.getElementById("app");
          if (appDiv) {
            appDiv.innerHTML = `
              <div class="min-h-screen bg-[#0F172A] p-5 flex items-center justify-center font-mono">
                <div class="bg-red-950/90 border-2 border-red-500 text-red-200 p-6 rounded-2xl max-w-lg w-full shadow-2xl text-right dir-rtl">
                  <h3 class="text-base font-bold text-red-400 mb-2">🎯 الملف المسبب للخطأ:</h3>
                  <div class="bg-black/60 p-3 rounded-lg border border-red-900 text-yellow-300 font-mono text-left break-all my-3" style="direction: ltr;">
                    ${filePath}
                  </div>
                  <p class="text-xs text-gray-300 font-bold mb-1">تفاصيل الخطأ:</p>
                  <p class="text-xs text-red-300 font-mono break-all">${err.message}</p>
                </div>
              </div>
            `;
          }
          return;
        }
      }
      window.hideSplash();
    }

    diagnoseApp();
  </script>
</body>
</html>
