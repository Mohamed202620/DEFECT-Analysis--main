<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAINTENANCE & DEFECT SYSTEM V1.0</title>

  <!-- مسار جذر المشروع في GitHub Pages -->
  <base href="/DEFECT-Analysis--main/" />

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E1117">

  <!-- Chart.js & Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- سكريبت مبكر لمنع التذبذب في الألوان أثناء التحميل -->
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <style>
    /* المتغيرات الأساسية للوضع الفاتح */
    :root {
      --app-main-bg: #f3f4f6; 
      --app-header-bg: rgba(255, 255, 255, 0.95);
      --app-card-bg: #ffffff;
      --app-card-inner: #f9fafb;
      --app-btn-bg: #ffffff;
      --app-btn-hover: #f3f4f6;
      --app-border: #e5e7eb;
      --app-text: #1f2937;
      --app-text-muted: #6b7280;
      --app-support-bg: #eff6ff;
      --app-support-border: #bfdbfe;
      --app-support-text: #1d4ed8;
      --app-icon-bg: #f3f4f6;
    }
    
    /* متغيرات الوضع الداكن */
    .dark, body.dark, html.dark, [data-theme="dark"] {
      --app-main-bg: #0f172a; 
      --app-header-bg: rgba(14, 17, 23, 0.9);
      --app-card-bg: rgba(30, 41, 59, 0.4);
      --app-card-inner: rgba(0, 0, 0, 0.2);
      --app-btn-bg: rgba(30, 41, 59, 0.6);
      --app-btn-hover: rgba(255, 255, 255, 0.1);
      --app-border: rgba(255, 255, 255, 0.08);
      --app-text: #f3f4f6;
      --app-text-muted: #9ca3af;
      --app-support-bg: rgba(37, 99, 235, 0.15);
      --app-support-border: rgba(37, 99, 235, 0.3);
      --app-support-text: #93c5fd;
      --app-icon-bg: rgba(255, 255, 255, 0.05);
    }

    * { 
      box-sizing: border-box; 
      font-family: system-ui, -apple-system, sans-serif; 
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; 
    }

    body, html, #app { 
      background-color: var(--app-main-bg) !important; 
      color: var(--app-text) !important; 
      margin: 0; 
      padding: 0; 
      min-height: 100vh; 
    }

    /* الكلاسات الديناميكية الموحدة */
    .dyn-header { background-color: var(--app-header-bg); border-color: var(--app-border); color: var(--app-text); }
    .dyn-card { background-color: var(--app-card-bg); border-color: var(--app-border); color: var(--app-text); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .dyn-card-inner { background-color: var(--app-card-inner); border-color: var(--app-border); }
    .dyn-btn { background-color: var(--app-btn-bg); border-color: var(--app-border); color: var(--app-text); }
    .dyn-btn:hover { background-color: var(--app-btn-hover); }
    .dyn-text-muted { color: var(--app-text-muted); }
    .dyn-support { background-color: var(--app-support-bg); border-color: var(--app-support-border); color: var(--app-support-text); }
    .dyn-icon { background-color: var(--app-icon-bg); border-color: var(--app-border); color: var(--app-text); }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash" class="fixed inset-0 w-full h-full bg-[#0E1117] flex flex-col items-center justify-center z-50 transition-opacity duration-700">
    <div class="flex-1 flex items-center justify-center p-4 w-full max-w-sm">
      <img src="1000230635.png" alt="Splash Icon" class="w-full max-h-[70vh] object-contain rounded-3xl shadow-2xl animate-pulse"/>
    </div>

    <div class="pb-10 flex flex-col items-center gap-5">
      <div class="px-5 py-1.5 bg-[#1E293B] rounded-full text-xs text-blue-400 border border-gray-700/60 font-semibold shadow-inner">
        v1.0 - 2026
      </div>
      <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- App Main Container -->
  <div id="app"></div>

  <!-- App Scripts -->
  <script>
    // تتبع أخطاء التطبيق
    window.addEventListener("error", function (e) {
        console.error("Application Error:", e.error || e.message);
    });

    window.addEventListener("unhandledrejection", function (e) {
        console.error("Promise Error:", e.reason);
    });

    // تسجيل الـ Service Worker لتفعيل خصائص الـ PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(err => {
            console.error('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>

  <!-- تحميل ملف التوجيه الأساسي -->
  <script type="module">
      console.log("جاري تحميل router...");
      import "./js/router.js";
      console.log("تم تحميل router بنجاح.");
  </script>
</body>
</html>
