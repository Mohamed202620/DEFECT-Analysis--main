<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="HandheldFriendly" content="true">
  <meta name="MobileOptimized" content="width">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Maintenance & Defect Analysis System (نظام إدارة الصيانة وتحليل العيوب)">
  <meta property="og:title" content="MAINTENANCE & DEFECT SYSTEM">
  <meta property="og:description" content="Maintenance & Defect Analysis System (نظام إدارة الصيانة وتحليل العيوب)">
  <title>MAINTENANCE & DEFECT SYSTEM</title>

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E1117">
  
  <script src="/api/config.js"></script>

  <!-- أيقونة التبويب في المتصفح (Favicon) -->
  <link rel="icon" type="image/png" href="assets/icons/app-icon.png">
  <link rel="shortcut icon" type="image/png" href="assets/icons/app-icon.png">

  <!-- دعم أجهزة iOS (Apple PWA Tags) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MaintSystem">
  <link rel="apple-touch-icon" href="assets/icons/app-icon.png">

  <script>
    (function lockMobileViewport() {
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      var lastTouchEndTime = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEndTime <= 300) {
          var target = e.target;
          var isInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT');
          if (!isInput) {
            e.preventDefault();
          }
        }
        lastTouchEndTime = now;
      }, false);
    })();
  </script>

  <!-- تحميل مسبق (Preload) للوجو الرسمي للشركة عشان يبقى جاهز
       فوراً في هيدر التطبيق وفي أول تقرير PDF يتصدّر (راجع
       js/branding.js -> getCompanyLogoDataUrl) -->
  <link rel="preload" as="image" href="assets/branding/company-banner.png">

  <!-- Chart.js & Tailwind CSS -->
  <script>
    tailwind = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appDark: '#0F172A',
            appCard: '#1E293B'
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

  <!-- dayjs: لحساب دورة الحضور والمرتبات (21 من الشهر إلى 20 من الشهر التالي) بدقة -->
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

  <!-- jsPDF + html2canvas: لتصدير التقارير PDF (نفس المسار الموحّد
       المستخدم في كل تقارير النظام - راجع js/services/exportUtility.js) -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  

  <!-- سكريبت منع التذبذب في الألوان -->
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
      localStorage.setItem('theme', 'dark');
    }

    window.hideSplash = function () {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 700);
      }
    };
  </script>

  <style>
    :root {
      --app-main-bg: #0f172a; 
      /* الهيدر العلوي (appHeader) بقى دايماً بلوحة الألوان الصناعية
         الداكنة (slate-900) بغض النظر عن وضع فاتح/داكن لباقي
         التطبيق - نفس فكرة أشرطة التحكم في لوحات الصيانة/الإنتاج
         الصناعية اللي بتفضل غامقة عشان تبقى "شريط أدوات" واضح
         ومتسق فوق أي محتوى تحته، بدل ما تتلوّن أبيض في الوضع
         النهاري وتقطع عن هوية الشركة (الشعار والألوان مصممين على
         خلفية غامقة أصلاً - راجع js/branding.js -> renderHeader) */
      --app-header-bg: rgba(15, 23, 42, 0.93);
      --app-card-bg: rgba(30, 41, 59, 0.4);
      --app-border: rgba(255, 255, 255, 0.08);
      --app-text: #f3f4f6;
    }
    
    .dark, body.dark, html.dark, [data-theme="dark"] {
      --app-main-bg: #0f172a; 
      --app-header-bg: rgba(15, 23, 42, 0.93);
      --app-card-bg: rgba(30, 41, 59, 0.4);
      --app-border: rgba(255, 255, 255, 0.08);
      --app-text: #f3f4f6;
    }

    * { 
      box-sizing: border-box; 
      font-family: system-ui, -apple-system, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--app-main-bg) !important; 
      color: var(--app-text) !important; 
      margin: 0; 
      padding: 0; 
      min-height: 100vh; 
      min-height: 100dvh;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      background-color: var(--app-main-bg) !important; 
      color: var(--app-text) !important; 
      margin: 0; 
      padding: 0; 
      min-height: 100vh; 
      min-height: 100dvh;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    input, textarea, select, [contenteditable="true"] {
      -webkit-user-select: auto;
      user-select: auto;
    }

    button, a, input, select, textarea, [role="button"] {
      touch-action: manipulation;
    }

    @media screen and (max-width: 768px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }

    input:focus, select:focus, textarea:focus {
      font-size: 16px !important;
    }

    img, video, canvas, svg {
      max-width: 100%;
    }

    input, select, textarea, button {
      max-width: 100%;
    }

    .dyn-card {
      background-color: var(--app-card-bg);
      border-color: var(--app-border);
    }

    .dyn-text-muted {
      color: var(--app-text);
    }

     #appShell {
       min-height: 100vh;
       /* مساحة فارغة أعلى المحتوى بارتفاع الهيدر الفعلي. المتغير
         --app-header-h بيتحدّث ديناميكياً من
         js/branding.js (refreshHeader) بالارتفاع الحقيقي المُقاس
         فعلياً، عشان يفضل مظبوط حتى لو الاسم طويل واتلف سطرين أو
         تغيّر حجم اللوجو بين الموبايل والكمبيوتر - بدل رقم ثابت
         ممكن يفضل مش دقيق */
      padding-top: var(--app-header-h, 90px);
    }

    /* إخفاء القائمة الجانبية على الموبايل والشاشات الصغيرة (< 768px) */
    @media (max-width: 767px) {
      #sidebarContainer {
        display: none !important;
      }
      #appShell {
        display: block !important;
      }
      #app {
        width: 100% !important;
        max-width: 100% !important;
      }
    }

    /* تحسين تجاوب شاشات التابلت (768px إلى 1023px) */
    @media (min-width: 768px) and (max-width: 1023px) {
      #sidebarContainer {
        display: none !important;
      }
      #appShell {
        display: block !important;
      }
      #app {
        width: 100% !important;
        max-width: 100% !important;
      }
      .app-page {
        max-width: 96% !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding-left: 1.5rem !important;
        padding-right: 1.5rem !important;
        padding-top: 1.5rem !important;
        padding-bottom: 5.5rem !important;
      }
    }

    /* شاشات الكمبيوتر واللابتوب والشاشات الكبيرة (1024px فما فوق) */
    @media (min-width: 1024px) {
      #sidebarContainer {
        display: block !important;
      }

      #appShell {
        display: flex !important;
        align-items: stretch !important;
      }

      #app {
        flex: 1 1 0% !important;
        min-width: 0 !important;
      }

      .app-page {
        max-width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        padding-left: 2rem !important;
        padding-right: 2rem !important;
        padding-top: 1.75rem !important;
        padding-bottom: 2rem !important;
      }

      [aria-label="Bottom Navigation"] {
        display: none !important;
      }
    }

    @media (min-width: 1280px) {
      .app-page {
        max-width: 1600px !important;
        margin-left: auto !important;
        margin-right: auto !important;
      }
    }

    #sidebarContainer::-webkit-scrollbar {
      width: 5px;
    }
    #sidebarContainer::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 10px;
    }

    /* تنسيقات متجاوبة للهيدر العلوي */
    #appHeader {
      user-select: none;
    }

    /* عكس صورة أيقونة الشعار أفقياً في وضع RTL (اللغة العربية) لتتجه فتحة الشعار نحو النص */
    [dir="rtl"] .app-header-logo,
    html[dir="rtl"] .app-header-logo,
    html[lang="ar"] .app-header-logo {
      transform: scaleX(-1);
    }

    [dir="rtl"] .app-header-logo:hover,
    html[dir="rtl"] .app-header-logo:hover,
    html[lang="ar"] .app-header-logo:hover {
      transform: scaleX(-1) scale(1.05);
    }

    [dir="ltr"] .app-header-logo,
    html[dir="ltr"] .app-header-logo,
    html[lang="en"] .app-header-logo {
      transform: scaleX(1);
    }

    [dir="ltr"] .app-header-logo:hover,
    html[dir="ltr"] .app-header-logo:hover,
    html[lang="en"] .app-header-logo:hover {
      transform: scale(1.05);
    }

    @media (max-width: 480px) {
      #appHeader .app-header-row-top {
        gap: 0.5rem;
      }

      #appHeader .app-header-row-bottom {
        gap: 0.5rem;
      }

      #appHeader .app-header-profile {
        padding-inline: 0.5rem;
        padding-block: 0.25rem;
      }
    }

    /* إصلاح (زر "🖨️ طباعة" في ملف الماكينة - MachineProfileView.js):
       window.print() كان بيطبع الصفحة بالكامل (الهيدر + الشريط
       الجانبي/السفلي + كل الأزرار) بدل ما يطبع بس بطاقة QR
       والاسم المطلوبين فعلياً للصق على الماكينة - فالزرار كان "شغال"
       تقنياً لكن نتيجته غير قابلة للاستخدام عملياً. دلوقتي بيتم إخفاء
       كل شيء عدا #machineQrPrintBox وقت الطباعة فقط (نفس نمط
       Print Isolation القياسي)، بدون أي تأثير على العرض العادي على
       الشاشة. */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #machineQrPrintBox,
      #machineQrPrintBox * {
        visibility: visible !important;
      }
      #machineQrPrintBox {
        position: fixed;
        inset: 0;
        display: flex !important;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff !important;
      }
      /* اسم الماكينة أسفل الـQR كان بلون text-white (أبيض على أبيض
         مع خلفية الطباعة البيضاء) فكان يختفي تماماً في الورقة
         المطبوعة رغم ظهوره بوضوح على الشاشة */
      #machineQrPrintBox * {
        color: #000 !important;
      }
      #machineQrPrintBox button {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash" class="fixed inset-0 w-full h-full bg-[#0E1117] flex flex-col items-center justify-center z-50 transition-opacity duration-700">
    <div class="flex-1 flex items-center justify-center p-4 w-full max-w-sm">
      <img src="assets/icons/app-icon.png" alt="Splash Icon" class="w-full max-h-[70vh] object-contain rounded-3xl shadow-2xl animate-pulse" onerror="this.style.display='none'"/>
    </div>

    <div class="pb-10 flex flex-col items-center gap-5">
      <div class="px-5 py-1.5 bg-[#1E293B] rounded-full text-xs text-blue-400 border border-gray-700/60 font-semibold shadow-inner">
        v1.0 - 2026
      </div>
      <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- Container -->
  <div id="appRoot">

    <!-- الهيدر الديناميكي المربوط بملف branding.js -->
    <header id="appHeader"></header>

    <div id="appShell">
      <aside id="sidebarContainer" class="hidden"></aside>
      <div id="app"></div>
    </div>

  </div>

  <!-- Error Handlers & SW -->
  <script>
    function showFatalError(errorMsg) {
      window.hideSplash();
      var appDiv = document.getElementById("app");
      if (appDiv && !appDiv.innerHTML.trim()) {
        appDiv.innerHTML = '<div class="min-h-screen flex items-center justify-center p-4 text-center bg-[#0F172A] font-mono text-white" dir="rtl">' +
          '<div class="bg-red-950/90 border border-red-500 text-red-200 p-6 rounded-2xl max-w-md w-full shadow-2xl space-y-3">' +
          '<h3 class="text-base font-bold text-red-400">⚠️ تعذر إقلاع النظام</h3>' +
          '<p class="text-xs text-yellow-300 font-mono break-all text-left" style="direction:ltr">' + (errorMsg || 'خطأ غير معروف أثناء الإقلاع') + '</p>' +
          '<div class="flex flex-col gap-2 pt-2">' +
          '<button onclick="location.reload();" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-xs font-bold text-white transition">إعادة المحاولة</button>' +
          '<button onclick="localStorage.clear(); sessionStorage.clear(); if(\'caches\' in window) caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).then(() => location.reload()); else location.reload();" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-bold text-white transition">مسح الذاكرة المؤقتة وإعادة التشغيل</button>' +
          '</div></div></div>';
      }
    }

    window.addEventListener("error", function (e) {
      console.error("Application Error:", e.error || e.message);
      showFatalError(e.message || String(e.error));
    });

    window.addEventListener("unhandledrejection", function (e) {
      console.error("Promise Error:", e.reason);
      var reasonMsg = e.reason && (e.reason.message || String(e.reason));
      showFatalError(reasonMsg);
    });

    if ('serviceWorker' in navigator) {
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('SW Registered:', reg.scope);
            reg.update();
          })
          .catch(err => console.error('SW Error:', err));
      });
    }

    setTimeout(() => { window.hideSplash(); }, 2500);
  </script>

  <!-- Router Loader & Dynamic Branding Header -->
  <script type="module">
    import { refreshHeader } from './js/branding.js';
    import { navigateTo, currentPage, render } from './js/router.js';
    import { auth, ensureAuthReady } from './js/config.js';

    async function initApp() {
      // بناء الهيدر فور تحميل الصفحة
      try {
        refreshHeader();
      } catch (e) {
        console.warn("Could not render header automatically:", String(e?.message || e));
      }

      try {
        const savedPhone = localStorage.getItem("phone");
        const savedUid = localStorage.getItem("userId");
        const initialHash = window.location.hash.replace("#", "");

        let targetPage = "login";

        if (!savedPhone && !savedUid) {
          targetPage = (initialHash === "register") ? "register" : "login";
        } else {
          // انتظار استعادة جلسة Firebase Auth لضمان إرسال رمز المصادقة الصالح مع جميع استعلامات Firestore
          const authUser = await ensureAuthReady();

          if (authUser) {
            if (initialHash && initialHash !== "login" && initialHash !== "register") {
              targetPage = initialHash;
            } else {
              targetPage = localStorage.getItem('lastPage') || 'home';
            }
          } else {
            // الجلسة غير متزامنة مع Firebase Auth - توجيه لصفحة تسجيل الدخول لتوثيق الجلسة
            targetPage = (initialHash === "register") ? "register" : "login";
          }
        }

        if (typeof navigateTo === 'function') {
          navigateTo(targetPage, false);
        } else if (typeof window.navigateTo === 'function') {
          window.navigateTo(targetPage, false);
        }

        if (typeof window.hideSplash === 'function') {
          window.hideSplash();
        }
      } catch (err) {
        const errorMsg = String(err?.message || err || 'Unknown initialization error');
        console.error("Router error: " + errorMsg);
        if (typeof window.hideSplash === 'function') {
          window.hideSplash();
        }

        const appDiv = document.getElementById("app");
        if (appDiv) {
          appDiv.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 text-center bg-[#0F172A] font-mono" dir="rtl">
              <div class="bg-red-950/80 border border-red-500 text-red-200 p-5 rounded-2xl max-w-md w-full shadow-2xl">
                  <h3 class="text-base font-bold text-red-400 mb-2">
                      ⚠️ تعذر تحميل التطبيق
                  </h3>
                  <p class="text-xs text-yellow-300 font-mono break-all my-2 text-left" style="direction:ltr">
                      ${errorMsg}
                  </p>
                  <p class="text-[11px] text-gray-400 mt-3">
                      اضغط على أداة Eruda لمعاينة تفاصيل الـ Console.
                  </p>
              </div>
          </div>
          `;
        }
      }
    }

    initApp();
  </script>
</body>
</html>
