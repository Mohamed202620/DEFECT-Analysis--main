<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAINTENANCE & DEFECT SYSTEM V1.0</title>

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E1117">

  <!-- Chart.js & Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <!-- سكريبت المظهر وذاكرة التخزين -->
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
    window.hideSplash = function () {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    };
  </script>

  <style>
    :root {
      --app-main-bg: #f3f4f6; 
      --app-header-bg: rgba(255, 255, 255, 0.95);
      --app-border: #e5e7eb;
      --app-text: #1f2937;
    }
    .dark, body.dark, html.dark {
      --app-main-bg: #0f172a; 
      --app-header-bg: rgba(14, 17, 23, 0.9);
      --app-border: rgba(255, 255, 255, 0.08);
      --app-text: #f3f4f6;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body, html, #app { 
      background-color: var(--app-main-bg) !important; 
      color: var(--app-text) !important; 
      margin: 0; padding: 0; min-height: 100vh; 
    }
  </style>
</head>
<body class="bg-[#0F172A]">

  <!-- Splash Screen -->
  <div id="splash" class="fixed inset-0 w-full h-full bg-[#0E1117] flex flex-col items-center justify-center z-50 transition-opacity duration-500">
    <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <!-- App Container -->
  <div id="appRoot">

    <!-- الهيدر الثابت الأصلي -->
    <header id="companyHeaderBar"
      style="background: var(--app-header-bg); border-bottom: 1px solid var(--app-border);"
      class="w-full flex items-center justify-center gap-3 px-3 py-2 sticky top-0 z-40">
      <img src="a_wide_horizontal_logo_graphic_on_a_transparent_b.png" alt="MSCANCO"
           style="height:38px; width:auto; object-fit:contain;"
           onerror="this.style.display='none'" />
      <div class="text-center leading-tight">
        <div class="text-[11px] sm:text-xs font-bold">شركة محمود سعيد لصناعة علب المرطبات والأغطية المحدودة</div>
        <div class="text-[8px] sm:text-[10px] font-semibold opacity-70">
          MAHMOOD SAEED BEVERAGE CANS &amp; ENDS INDUSTRY CO. LTD. (MSCANCO)
        </div>
      </div>
    </header>

    <div id="appShell">
      <aside id="sidebarContainer" class="hidden"></aside>
      <div id="app"></div>
    </div>

  </div>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
      });
    }
    setTimeout(() => { window.hideSplash(); }, 3000);
  </script>

  <!-- Router Loader -->
  <script type="module">
    import('./js/router.js')
      .then((router) => {
        const isLoggedIn = localStorage.getItem("phone") || localStorage.getItem("userId");
        const initialHash = window.location.hash.replace("#", "");
        let targetPage = "login";

        if (!isLoggedIn) {
          targetPage = (initialHash === "register") ? "register" : "login";
        } else {
          targetPage = (initialHash && initialHash !== "login" && initialHash !== "register") 
            ? initialHash 
            : (localStorage.getItem('lastPage') || 'home');
        }

        if (typeof router.navigateTo === 'function') router.navigateTo(targetPage, false);
        else if (typeof window.navigateTo === 'function') window.navigateTo(targetPage, false);

        window.hideSplash();
      })
      .catch((err) => {
        console.error("Router error:", err);
        window.hideSplash();
      });
  </script>

</body>
</html>
