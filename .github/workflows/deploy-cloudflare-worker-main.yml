name: Deploy Cloudflare Worker (main)

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/worker.mjs"
      - ".github/workflows/deploy-cloudflare-worker-main.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-main
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        # actions/checkout v4 pinned to its release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        # actions/setup-node v4 pinned to its release commit
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Run Worker tests (mocked, no production access)
        run: |
          node tests/worker-tests.mjs
          node tests/integration-upload.mjs
          node tests/client-reset.mjs

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy cloudflare-worker/worker.mjs --keep-vars --name odd-sun-fab8 --compatibility-date 2026-10-12

      - name: Verify production Worker health and project
        run: |
          # Never print the response body: a misconfigured/old Worker must not leak secrets into Actions logs.
          body="$(curl -fsS --retry 5 --retry-delay 3 https://odd-sun-fab8.mom379339.workers.dev/health)"
          printf '%s' "$body" | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let data;
              try { data = JSON.parse(raw); } catch { console.error("Health check returned invalid JSON (body suppressed)."); process.exit(1); }
              const valid = data && data.environment === "production"
                && data.projectId === "maintenance-defect-system"
                && data.hostingSite === "maintenance-defect-system"
                && data.ok === true
                && data.diagnostics && data.diagnostics.serviceAccountConfigured === true
                && data.diagnostics.serviceAccountJsonValid === true;
              if (!valid) {
                console.error("Production health check failed. Safe diagnostics:", JSON.stringify({
                  ok: data?.ok,
                  environment: data?.environment,
                  projectId: data?.projectId,
                  hostingSite: data?.hostingSite,
                  diagnostics: data?.diagnostics
                }));
                process.exit(1);
              }
            });
          '
