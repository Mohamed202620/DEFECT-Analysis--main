name: Deploy Cloudflare Worker (dev)

on:
  push:
    branches:
      - dev
    paths:
      - "cloudflare-worker/worker.mjs"
      - ".github/workflows/deploy-cloudflare-worker-dev.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        # actions/checkout v4 (pinned tag commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        # actions/setup-node v4 (pinned tag commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Run Worker tests (mocked, no network or cloud access)
        run: |
          node tests/worker-tests.mjs
          node tests/integration-upload.mjs
          node tests/client-reset.mjs

      - name: Deploy dev Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --keep-vars: never wipe the Text variables set in the dashboard (secrets are kept anyway)
          command: deploy --keep-vars

      - name: Verify dev Worker is healthy and bound to the dev project
        run: |
          body="$(curl -fsS --retry 5 --retry-delay 3 https://maintenance-backend-dev.mom379339.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -q '"environment":"development"'
          echo "$body" | grep -q '"projectId":"dev-test-37e8a"'
