name: Deploy Cloudflare Worker (dev)

on:
  push:
    branches:
      - dev
    paths:
      - "cloudflare-worker/worker.mjs"
      - "cloudflare-worker/wrangler.toml"
      - ".github/workflows/deploy-cloudflare-worker-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Verify Worker targets dev only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("cloudflare-worker/worker.mjs", "utf8");
          const checks = [
            ['dev project ID', /dev-test-37e8a/],
            ['development environment guard', /development/],
            ['production project ID must not be the configured dev target', /dev-test-37e8a/],
          ];
          for (const [label, pattern] of checks) {
            if (!pattern.test(source)) {
              console.error(`Worker dev safety check failed: ${label}`);
              process.exit(1);
            }
          }
          NODE

      - name: Check Worker JavaScript syntax
        run: node --check cloudflare-worker/worker.mjs

      - name: Deploy dev Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy cloudflare-worker/worker.mjs --name maintenance-backend-dev --compatibility-date 2026-10-19
