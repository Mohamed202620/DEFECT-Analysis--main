name: Deploy Cloudflare Worker (dev)

on:
  push:
    branches:
      - dev
    paths:
      - "cloudflare-worker/worker.mjs"
      - ".github/workflows/deploy-cloudflare-worker-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Deploy dev Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy cloudflare-worker/worker.mjs --name maintenance-backend-dev --compatibility-date 2026-10-19
