name: Deploy Firebase Hosting (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v4 (pinned tag commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java for Firebase Emulator
        # actions/setup-java v4.7.1 (pinned tag commit)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        # actions/setup-node v4 (pinned tag commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run tests and import checks
        run: npm test

      - name: Run Firestore Emulator rules tests
        run: npm run test:rules

      - name: Build project (syntax + assets + SW build id)
        run: npm run build

      - name: Validate and generate isolated dev Firebase config
        run: node scripts/prepare-dev-deploy.mjs
        env:
          FIREBASE_DEV_PROJECT_ID: ${{ vars.FIREBASE_DEV_PROJECT_ID }}
          FIREBASE_DEV_API_KEY: ${{ vars.FIREBASE_DEV_API_KEY }}
          FIREBASE_DEV_APP_ID: ${{ vars.FIREBASE_DEV_APP_ID }}
          FIREBASE_DEV_AUTH_DOMAIN: ${{ vars.FIREBASE_DEV_AUTH_DOMAIN }}
          FIREBASE_DEV_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_DEV_MESSAGING_SENDER_ID }}
          FIREBASE_DEV_STORAGE_BUCKET: ${{ vars.FIREBASE_DEV_STORAGE_BUCKET }}
          FIREBASE_DEV_FUNCTIONS_REGION: ${{ vars.FIREBASE_DEV_FUNCTIONS_REGION }}
          FIREBASE_DEV_BACKEND_WORKER_URL: ${{ vars.FIREBASE_DEV_BACKEND_WORKER_URL }}
          FIREBASE_DEV_HOSTING_SITE: ${{ vars.FIREBASE_DEV_HOSTING_SITE }}
          FIREBASE_DEV_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DEV_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        # FirebaseExtended/action-hosting-deploy v0 tag (pinned commit)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_DEV_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_DEV_PROJECT_ID }}
          channelId: live
          target: dev