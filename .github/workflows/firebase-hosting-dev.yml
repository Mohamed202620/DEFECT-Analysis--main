name: Deploy Firebase Hosting (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    # نشر dev يستخدم مشروع Firebase المنفصل (dev-test-37e8a) فقط، وبياناته الخاصة:
    # FIREBASE_DEV_PROJECT_ID + FIREBASE_DEV_SERVICE_ACCOUNT. لا يستعمل أي بيانات إنتاج.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # actions/checkout v4 (pinned tag commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java for Firebase Emulator
        # actions/setup-java v4.7.1 (pinned tag commit)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        # actions/setup-node v4 (pinned tag commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run tests and import checks
        run: npm test

      - name: Run Firestore Emulator rules tests
        run: npm run test:rules

      - name: Validate dev project and dev deploy credential
        run: node scripts/validate-dev-deploy.mjs
        env:
          FIREBASE_DEV_PROJECT_ID: ${{ secrets.FIREBASE_DEV_PROJECT_ID || vars.FIREBASE_DEV_PROJECT_ID }}
          FIREBASE_DEV_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DEV_SERVICE_ACCOUNT }}

      - name: Verify dev Worker is bound to the dev project
        run: node scripts/verify-dev-targets.mjs worker

      - name: Generate dev runtime config (api/config.js)
        run: node scripts/generate-dev-config.mjs
        env:
          FIREBASE_DEV_PROJECT_ID: ${{ env.FIREBASE_DEV_PROJECT_ID_VALIDATED }}
          FIREBASE_DEV_API_KEY: ${{ secrets.FIREBASE_DEV_API_KEY || vars.FIREBASE_DEV_API_KEY }}
          FIREBASE_DEV_APP_ID: ${{ secrets.FIREBASE_DEV_APP_ID || vars.FIREBASE_DEV_APP_ID }}
          FIREBASE_DEV_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_DEV_MESSAGING_SENDER_ID || vars.FIREBASE_DEV_MESSAGING_SENDER_ID }}
          FIREBASE_DEV_STORAGE_BUCKET: ${{ secrets.FIREBASE_DEV_STORAGE_BUCKET || vars.FIREBASE_DEV_STORAGE_BUCKET }}

      - name: Build project (syntax + assets + SW build id)
        run: npm run build

      - name: Verify Hosting target belongs to the dev project
        run: node scripts/verify-dev-targets.mjs site

      - name: Deploy Firestore rules and indexes (dev project only)
        env:
          FIREBASE_DEV_PROJECT_ID_VALIDATED: ${{ env.FIREBASE_DEV_PROJECT_ID_VALIDATED }}
          FIREBASE_DEV_SERVICE_ACCOUNT_NORMALIZED: ${{ env.FIREBASE_DEV_SERVICE_ACCOUNT_NORMALIZED }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("/tmp/firebase-dev-service-account.json", process.env.FIREBASE_DEV_SERVICE_ACCOUNT_NORMALIZED, { mode: 0o600 });'
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-dev-service-account.json
          npx firebase-tools deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_DEV_PROJECT_ID_VALIDATED" --non-interactive
          rm -f /tmp/firebase-dev-service-account.json

      - name: Deploy to Firebase Hosting (dev project)
        # FirebaseExtended/action-hosting-deploy v0 tag (pinned commit)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          firebaseServiceAccount: ${{ env.FIREBASE_DEV_SERVICE_ACCOUNT_NORMALIZED }}
          projectId: ${{ env.FIREBASE_DEV_PROJECT_ID_VALIDATED }}
          channelId: live
          target: dev
          disableComment: true
