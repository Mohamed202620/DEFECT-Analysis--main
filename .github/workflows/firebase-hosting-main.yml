name: Deploy Firebase Hosting (main)

on:
  push:
    branches:
      - main

# Serialize all production Firebase deployments, including the manual
# Firestore-only workflow, so rules and Hosting cannot deploy concurrently.
concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires the GitHub Environment "production" with required reviewers.
    # The production credential is released only after manual approval.
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # actions/checkout v4 (pinned commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Detect Firestore rules or indexes changes
        id: firestore_changes
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD -- firestore.rules firestore.indexes.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Firestore rules/indexes changed; they will be tested and deployed before Hosting."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Firestore rules/indexes changes detected."
          fi

      - name: Set up Java for Firebase Emulator
        # actions/setup-java v4.7.1 (pinned commit)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        # actions/setup-node v4 (pinned commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Cache Firestore Emulator
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulator-${{ hashFiles('package-lock.json', 'firebase.json') }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run tests and import checks
        run: npm test

      - name: Run Firestore Emulator rules tests
        run: npm run test:rules

      - name: Build project (syntax + assets + SW build id)
        run: npm run build

      - name: Validate production deploy credential project
        run: node scripts/validate-production-deploy.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes before Hosting
        if: steps.firestore_changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/firebase-production-sa.json"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_NORMALIZED" > "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          npx firebase deploy --only firestore:rules,firestore:indexes --project maintenance-defect-system --non-interactive

      - name: Deploy to Firebase Hosting
        # FirebaseExtended/action-hosting-deploy v0 (pinned commit)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT_NORMALIZED }}
          projectId: maintenance-defect-system
          channelId: live
          target: main
          disableComment: true
