name: Deploy Firebase Hosting (main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # اختبارات منطقية (بدون شبكة). continue-on-error: لا توقف النشر حتى تتأكد أنها مستقرة على Node 20
      - name: Run logic tests
        continue-on-error: true
        run: |
          node tests/run-logic-tests.mjs
          node tests/worker-tests.mjs
          node tests/integration-upload.mjs
          node tests/client-reset.mjs

      - name: Build project (syntax + assets + SW build id)
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: maintenance-defect-system
          channelId: live
          target: main