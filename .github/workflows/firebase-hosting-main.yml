name: Deploy Firebase Hosting (main)

on:
  push:
    branches:
      - main

# Serialize all production Firebase deployments, including the manual
# Firestore-only workflow, so rules and Hosting cannot deploy concurrently.
concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires the GitHub Environment "production" with required reviewers.
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Detect Firestore rules or indexes changes
        id: firestore_changes
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD -- firestore.rules firestore.indexes.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Firestore rules/indexes changed; they will be tested and deployed before Hosting."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Firestore rules/indexes changes detected."
          fi

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Cache Firestore Emulator
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulator-${{ hashFiles('package-lock.json', 'firebase.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests and import checks
        run: npm test

      - name: Run Firestore Emulator rules tests
        run: npm run test:rules

      - name: Build project
        run: npm run build

      - name: Validate production deploy credential project
        run: node scripts/validate-production-deploy.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Use the same normalized credential file for both deployments.
      # Any failure stops the sequence; Hosting cannot run after a failed
      # Firestore deployment. The temporary credential is always removed.
      - name: Deploy Firestore (if changed), then Hosting
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_NORMALIZED: ${{ env.FIREBASE_SERVICE_ACCOUNT_NORMALIZED }}
          FIRESTORE_CHANGED: ${{ steps.firestore_changes.outputs.changed }}
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/firebase-production-sa.json"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_NORMALIZED" > "$credential_file"
          chmod 600 "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"

          if [ "$FIRESTORE_CHANGED" = "true" ]; then
            echo "Deploying Firestore rules and indexes first..."
            npx firebase deploy --only firestore:rules,firestore:indexes --project maintenance-defect-system --non-interactive
          fi

          echo "Deploying Firebase Hosting target main..."
          npx firebase deploy --only hosting:main --project maintenance-defect-system --non-interactive
