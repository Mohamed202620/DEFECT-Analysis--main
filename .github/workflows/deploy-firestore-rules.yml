name: Deploy Firestore Rules and Indexes (manual)

# Manual rules/indexes-only deployment. Shares a concurrency lock with the
# production Hosting workflow to prevent overlapping Firebase deployments.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  deploy-rules:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Cache Firestore Emulator
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulator-${{ hashFiles('package-lock.json', 'firebase.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Firestore Emulator rules tests (must pass before deploy)
        run: npm run test:rules

      - name: Validate production deploy credential project
        run: node scripts/validate-production-deploy.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes
        shell: bash
        run: |
          set -euo pipefail
          : "${GOOGLE_APPLICATION_CREDENTIALS:?Validated credential file path is missing}"
          test -s "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npx firebase deploy --only firestore:rules,firestore:indexes --project maintenance-defect-system --non-interactive
