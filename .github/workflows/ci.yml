name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulator-${{ hashFiles('package-lock.json', 'firebase.json') }}
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules
